- type: entity
  id: CMUZLevelLadderThrough
  abstract: true
  name: z-level ladder through
  description: A ladder that connects two Z-levels vertically.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/ladderss13.rsi
    state: ladder_bottom
    noRot: true
    offset: 0, 0.25
    drawdepth: WallTops
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: CMUZLevelLadderThrough
  id: CMUZLevelLadderThroughDown
  name: z-level ladder down
  suffix: Down
  description: A ladder that goes down to the level below.
  components:
  - type: Sprite
    state: ladder_top
  - type: CMUZLevelLadder
    offset: -1
    landingLocalPosition: 0
