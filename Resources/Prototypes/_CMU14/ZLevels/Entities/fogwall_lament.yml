- type: entity
  id: CMUFogWallLamentWaterfallMist
  name: waterfall mist
  description: A waterfall mist fog wall.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
  - type: Sprite
    sprite: Structures/world.rsi
    state: fog
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1,1,1"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: false
  - type: Occluder
    enabled: false
